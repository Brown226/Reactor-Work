# Reactor 运维台（reactor-ops）
#
# 独立于主 Web 容器（reactor-web）的特权容器：平台管理员登录后，agent 以宿主机
# root 视角运行，用来改 Docker 配置、清理磁盘垃圾、管服务器。
#
# 权限面（刻意开到最大，仅 admin 可登录）：
#   - privileged + pid: host：能看/管宿主进程与服务；
#   - /:/host:rw：宿主根文件系统（清理 /var/log、改 /etc/docker 等）；
#   - /var/run/docker.sock：容器内 docker CLI 直接管宿主 Docker。
#
# 隔离边界：
#   - 普通用户登录会被服务端拒绝（REACTOR_WEB_ADMIN_ONLY=1）；
#   - 与主 Web 容器、用户数据卷完全分开（独立项目 reactor-ops、独立 ops-data 卷）；
#   - 不用时 `docker compose -p reactor-ops down` 即可关闭整台运维台。
#
# 启动：sh load-and-up.sh（或 docker compose -p reactor-ops -f compose.yml up -d）
services:
  reactor-ops:
    image: reactor-ops:v1.1.1
    container_name: reactor-ops
    restart: unless-stopped
    # 最高权限：宿主内核能力、宿主 PID 空间、宿主网络
    privileged: true
    pid: host
    network_mode: host
    environment:
      PORT: "3040"
      HOST: 0.0.0.0
      # 每浏览器企业登录；只允许 platform_admin
      REACTOR_WEB_SESSION_AUTH: "1"
      REACTOR_WEB_ADMIN_ONLY: "1"
      # worker 不降权（以容器 root 运行，工作区 = /host）
      REACTOR_WEB_PRIVILEGED: "1"
      REACTOR_WEB_SESSION_TTL_SECONDS: ${REACTOR_WEB_SESSION_TTL_SECONDS:-28800}
      REACTOR_WEB_COOKIE_SECURE: ${REACTOR_WEB_COOKIE_SECURE:-0}
      # 宿主机视角：worker 不降权（root），工作区是宿主根
      ZCODE_WEB_USER_SANDBOX: "0"
      ZCODE_DATA_BASE_DIR: /data
      ZCODE_SERVER_WORKSPACE: /host
      # network_mode: host 下 identity/gateway 走宿主端口
      REACTOR_IDENTITY_URL: ${REACTOR_IDENTITY_URL:-http://127.0.0.1:8791}
      REACTOR_GATEWAY_URL: ${REACTOR_GATEWAY_URL:-http://127.0.0.1:8790/v1}
    volumes:
      # 宿主根（读写）：清理垃圾、改 Docker/系统配置
      - /:/host:rw
      # Docker 控制面：容器内 docker CLI 直接操作宿主 Docker
      - /var/run/docker.sock:/var/run/docker.sock
      # 运维台自己的会话库/凭据（与主 Web 的用户数据卷隔离）
      - ops-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3040/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  ops-data:
