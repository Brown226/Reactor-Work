services:
  reactor-web:
    image: reactor-web:v1.1.1
    container_name: reactor-web
    restart: unless-stopped
    ports:
      - "3030:3030"
    environment:
      # 每浏览器企业登录会话；不再下发部署级共享令牌。
      # 未登录访问只看到登录页，/api 与 /ws 一律 401。
      REACTOR_WEB_SESSION_AUTH: "1"
      # 默认 7 天，固定有效期；应与 identity 的 REACTOR_REFRESH_TTL_SECONDS 对齐。
      REACTOR_WEB_SESSION_TTL_SECONDS: ${REACTOR_WEB_SESSION_TTL_SECONDS:-604800}
      # HTTPS 部署必须设为 1；纯 HTTP 内网联调保持 0，否则浏览器不会回传 Cookie。
      REACTOR_WEB_COOKIE_SECURE: ${REACTOR_WEB_COOKIE_SECURE:-0}
      ZCODE_SERVER_WORKSPACE: /data/workspace
      ZCODE_DATA_BASE_DIR: /data
      # 本容器视角的 identity 地址：Web 登录请求由本容器转发，用户浏览器无需可达。
      # 下发后登录页锁定地址、隐藏输入框，最终用户只填账号密码。
      # ⚠ 值必须是同一 compose 网络内的服务名（默认 identity），不是宿主 IP。
      REACTOR_IDENTITY_URL: ${REACTOR_IDENTITY_URL:-http://identity:8791}
      # identity 与 gateway 在 compose 里是两个服务（hostname 不同），端口推导会拼出
      # 不存在的 host；显式给出网关地址，否则登录后模型目录永远为空。
      REACTOR_GATEWAY_URL: ${REACTOR_GATEWAY_URL:-http://gateway:8790/v1}
    # Linux 宿主上若模型/服务在宿主侧（host.docker.internal），必须放开下面这行：
    # Docker Desktop 自带该映射，Linux 默认没有。
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"
    volumes:
      - web-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3030/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  web-data:
