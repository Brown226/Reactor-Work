# 门户站点配置：纯静态、UTF-8、开启 gzip、静态资源带缓存头。
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/json text/plain;

  # HTML 入口不缓存，保证发新版后用户立刻看到更新。
  location ~* \.html$ {
    add_header Cache-Control "no-cache";
  }

  # 样式/图片按内容变化低频，允许短缓存。
  location ~* \.(css|js|png|jpg|jpeg|webp|svg|ico)$ {
    add_header Cache-Control "public, max-age=3600";
  }

  # ── 下载面反代（UPD）─────────────────────────────────────────────
  # 首页「下载 Reactor」用**同源相对路径** /download 直达服务端下载页，
  # 站内因此不出现任何内网地址；下载页里的列表接口与产物链接也都是相对路径，
  # 一并经此转发，浏览器只与门户同源通信。
  #
  # 目标 = 服务端 identity 的更新下发面（公开段）：
  #   /download                          下载页（自包含 HTML）
  #   /api/v1/releases/published         各平台最新已发布版本列表
  #   /api/v1/releases/electron/files/*  安装包产物（支持 Range）
  #
  # ★ 部署时唯一要按环境改的一行 = 下面 $reactor_origin：
  #   - 门户与 identity 在**同一 Docker 网络**（如都写进服务端 compose）：保持
  #     "identity:8791"（用服务名，走容器网络，不经过宿主回环）。
  #   - 门户**单独部署**、与 identity 不同网：改成门户能访问到的地址，
  #     例如 "10.x.x.x:8791" 或反向代理后的域名。
  # 用变量 + Docker 内置 DNS 延迟解析：上游解析不到或暂时不可达时，
  # 门户照常启动，仅下载这两个路径返回 502，不会拖垮整站。
  resolver 127.0.0.11 valid=30s ipv6=off;
  set $reactor_origin "identity:8791";

  location = /download {
    proxy_pass http://$reactor_origin;
    proxy_http_version 1.1;
    # 安装包可达数百 MB：不缓冲，边收边转发，省内存与磁盘（Range 续传照常）。
    proxy_buffering off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /api/v1/releases/ {
    proxy_pass http://$reactor_origin;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
