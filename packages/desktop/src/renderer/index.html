<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reactor</title>
    <script>
      // 启动封面层：在样式生效前解析主题偏好，给启动壳铺上主题同色底。
      // 桌面主窗口是透明窗口（backgroundColor: #00000000），若启动壳没有底色，
      // 从窗口创建到 React 首帧之间会露出浏览器默认白底——深色主题用户看到一次白闪。
      // 口径与 packages/ui/src/useTheme.ts 保持一致：dark/zai-dark 为深色，
      // light/zai-light 为浅色，system 或缺失时跟随系统偏好。
      (function () {
        try {
          var saved = window.localStorage.getItem("zcode-theme");
          var dark;
          if (saved === "dark" || saved === "zai-dark") {
            dark = true;
          } else if (saved === "light" || saved === "zai-light") {
            dark = false;
          } else {
            dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          }
          document.documentElement.setAttribute("data-startup-theme", dark ? "dark" : "light");
        } catch (error) {
          // 读不到偏好时按产品默认主题（zai-dark）兜底。
          document.documentElement.setAttribute("data-startup-theme", "dark");
        }
      })();
    </script>
    <style>
      /* 启动壳封面底色：深浅各一档中性格，脚本未跑到时的默认兜底也用深色。 */
      html[data-startup-theme="dark"] {
        --startup-cover-bg: #1a1a1c;
      }

      html[data-startup-theme="light"] {
        --startup-cover-bg: #f6f6f7;
      }

      html,
      body,
      #root {
        margin: 0;
        width: 100%;
        height: 100%;
      }

      #root {
        opacity: 0;
        transition: opacity 0.16s ease;
      }

      body.zcode-startup-ready #root {
        opacity: 1;
      }

      #loading {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        align-items: center;
        justify-content: center;
        /* 铺满整窗的主题封面底色，消除透明窗口在 React 首帧前的白闪。 */
        background-color: var(--startup-cover-bg, #1a1a1c);
        transition: opacity 0.16s ease;
      }

      body.zcode-startup-ready #loading {
        pointer-events: none;
        opacity: 0;
      }

      /* 标记使用深蓝圆角底板，深浅主题下都自成对比，无需再套深色壳。 */
      .startup-logo-shell {
        display: flex;
        align-items: center;
        justify-content: center;
        transform: scale(0.72);
        opacity: 0;
        animation: startup-logo-pop 0.72s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        transform-origin: center;
      }

      .startup-logo {
        width: 80px;
        height: auto;
        border-radius: 22%;
        box-shadow: 0 8px 24px rgb(0 0 0 / 28%);
      }

      @keyframes startup-logo-pop {
        0% {
          opacity: 0;
          transform: scale(0.72);
        }

        38% {
          opacity: 1;
          transform: scale(1.045);
        }

        58% {
          transform: scale(0.985);
        }

        76% {
          transform: scale(1.008);
        }

        100% {
          opacity: 1;
          transform: scale(1);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .startup-logo-shell {
          opacity: 1;
          transform: scale(1);
          animation: none;
        }
      }
    </style>
  </head>

    <script type="module">
      const startupLogoShell = document.querySelector(".startup-logo-shell");
      const startupLoading = document.getElementById("loading");
      const isUpdateStatusWindow =
        new URLSearchParams(window.location.search).get("windowKind") === "update-status";
      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      let finished = false;
      let animationDone = false;
      let reactReady = false;

      // 主入口不能依赖动画结束后的动态 import；一旦导入路径在 Electron/Vite 下失败，
      // 页面会永久停在 HTML loading。这里让主入口静态加载，只把启动壳作为动画遮罩延迟移除。
      const tryFinishStartupAnimation = () => {
        if (finished || !animationDone || !reactReady) return;
        finished = true;
        document.body.classList.add("zcode-startup-ready");
        window.setTimeout(() => startupLoading?.remove(), 500);
      };

      const markAnimationDone = () => {
        animationDone = true;
        tryFinishStartupAnimation();
      };

      const markReactReady = () => {
        reactReady = true;
        tryFinishStartupAnimation();
      };

      if (isUpdateStatusWindow) {
        // 更新状态窗口本身就是一个轻量弹窗，复用主入口 HTML 时不应再显示启动壳。
        // 否则透明独立窗口里的启动 logo 会短暂或持续盖在更新按钮上，看起来像弹窗 UI 异常。
        finished = true;
        document.body.classList.add("zcode-startup-ready");
        startupLoading?.remove();
      } else {
        window.addEventListener("zcode-react-startup-ready", markReactReady, { once: true });
      }

      if (isUpdateStatusWindow || reduceMotion || !startupLogoShell) {
        markAnimationDone();
      } else {
        startupLogoShell.addEventListener("animationend", markAnimationDone, { once: true });
        window.setTimeout(markAnimationDone, 1000);
      }

      if (!isUpdateStatusWindow) {
        window.setTimeout(markReactReady, 3000);
      }
    </script>
    <script type="module" src="./src/main.tsx"></script>
