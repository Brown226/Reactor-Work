# Reactor Web 同源反代（HTTPS）
#
# 为什么需要它：
# 1. 同源后浏览器登录 identity 不再跨源，REACTOR_ALLOWED_ORIGINS 不再是登录的硬依赖；
# 2. identity 只需在 compose 网络内可达，不必向用户网段暴露 8791；
# 3. 浏览器高级能力（附件大文件、通知、PWA、File System Access…）要求安全上下文。
#
# 路由约定（identity 与 web 的路径互不重叠，按前缀最长匹配）：
#   identity :8791  →  /auth/  /me/  /depts/  /users  /users/  /v1/  /desktop/  /download  /api/v1/
#   web      :3030  →  /ws（WebSocket 升级）、/api/（server-info、user-workspace 等）、/（静态 SPA）
# 注意：/api/v1/（identity 的反馈与版本下发）必须写在 /api/（web）之前——
#       nginx 按最长前缀选择 location，这里显式分开只为可读性。
#
# 管理台（:8792 的 /console/ 与 /admin/*）不经过本代理：它是管理员专用面，
# 按原部署口径只对管理网段开放 8792，不与普通用户的 Web 入口混在同一来源。

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;

  # 大文件上传（图纸可达几十 MB，base64 分片后体积还会放大）
  client_max_body_size 200m;

  # WebSocket 升级映射
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
  }

  # HTTP → HTTPS
  server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # ---- identity（浏览器直连的身份接口；同源后无跨域问题）----
    location /auth/ {
      proxy_pass http://identity:8791;
      include /etc/nginx/proxy-headers.conf;
    }
    location /me/ {
      proxy_pass http://identity:8791;
      include /etc/nginx/proxy-headers.conf;
    }
    location /depts/ {
      proxy_pass http://identity:8791;
      include /etc/nginx/proxy-headers.conf;
    }
    location /users {
      proxy_pass http://identity:8791;
      include /etc/nginx/proxy-headers.conf;
    }
    location /v1/ {
      proxy_pass http://identity:8791;
      include /etc/nginx/proxy-headers.conf;
    }
    location /desktop/ {
      proxy_pass http://identity:8791;
      include /etc/nginx/proxy-headers.conf;
    }
    location /download {
      proxy_pass http://identity:8791;
      include /etc/nginx/proxy-headers.conf;
    }
    location /api/v1/ {
      proxy_pass http://identity:8791;
      include /etc/nginx/proxy-headers.conf;
    }

    # ---- reactor-web（界面 + 服务端工作区 + agent）----
    location /ws {
      proxy_pass http://reactor-web:3030;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # 会话是长连接：读空闲放宽，避免长时间对话被代理掐断
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }
    location /api/ {
      proxy_pass http://reactor-web:3030;
      include /etc/nginx/proxy-headers.conf;
    }
    location / {
      proxy_pass http://reactor-web:3030;
      include /etc/nginx/proxy-headers.conf;
    }
  }
}
